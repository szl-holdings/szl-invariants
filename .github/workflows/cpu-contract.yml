name: CPU kernel contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cpu-kernel-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify canonical kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Verify restored Hub kernel and falsifiability suite
        shell: bash
        run: |
          set -euo pipefail
          kernel='build/torch-universal/szl_invariants/__init__.py'
          mirror='torch-ext/szl_invariants/__init__.py'
          cmp "$kernel" "$mirror"
          cmp build/torch-universal/szl_invariants/metadata.json \
            torch-ext/szl_invariants/metadata.json
          grep -Fq 'def verify_ed25519(' "$kernel"
          grep -Fq 'def run_invariants(' "$kernel"
          grep -Fq 'def selfcheck(' "$kernel"
          grep -Fq 'def _build_demo_chain(' "$kernel"
          test ! -e model.joblib
          if grep -R -n -E "joblib\.(load|dump)[[:space:]]*\(|pickle\.loads?[[:space:]]*\(|dill\.load[[:space:]]*\(" scripts tests torch-ext build; then
            echo "unsafe serialization API still in approved path" >&2
            exit 1
          fi
          python -I -m py_compile "$kernel" tests/test_invariants.py \
            tests/test_model_kernel_parity.py tests/test_no_unsafe_serialization.py
          python -I tests/test_invariants.py
          python -I tests/test_no_unsafe_serialization.py
          python -I scripts/eval.py
          git diff --check

      - name: CPU kernel smoke
        env:
          PYTHONPATH: ${{ github.workspace }}/torch-ext
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest tests -q --tb=short
