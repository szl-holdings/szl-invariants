name: CPU kernel contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cpu-kernel-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify canonical kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit

      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.13'
          check-latest: false

      # The Hub build/ (torch-cpu + torch-universal) is generated from torch-ext/ by
      # hf-kernel-publish.yml and verified there through get_kernel; it is never committed.
      - name: Verify canonical kernel source and falsifiability suite
        shell: bash
        run: |
          set -euo pipefail
          kernel='torch-ext/szl_invariants/__init__.py'
          test -z "$(git ls-files -- build)"
          grep -Fq 'def verify_ed25519(' "$kernel"
          grep -Fq 'def run_invariants(' "$kernel"
          grep -Fq 'def selfcheck(' "$kernel"
          grep -Fq 'def _build_demo_chain(' "$kernel"
          test ! -e model.joblib
          if grep -R -n -E "joblib\.(load|dump)[[:space:]]*\(|pickle\.loads?[[:space:]]*\(|dill\.load[[:space:]]*\(" scripts tests torch-ext hf; then
            echo "unsafe serialization API still in approved path" >&2
            exit 1
          fi
          python -I -m py_compile "$kernel" tests/test_invariants.py \
            tests/test_model_kernel_parity.py tests/test_no_unsafe_serialization.py
          python -I tests/test_invariants.py
          python -I tests/test_no_unsafe_serialization.py
          python -I scripts/eval.py
          git diff --check

      - name: CPU kernel smoke
        env:
          PYTHONPATH: ${{ github.workspace }}/torch-ext
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest "cryptography==49.0.0"
          python -m pytest tests -q --tb=short

      - name: Verify clean wheel and editable imports outside source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/invariants-wheels"
          python -m venv "$RUNNER_TEMP/invariants-installed"
          installed_python="$RUNNER_TEMP/invariants-installed/bin/python"
          "$installed_python" -m pip install --no-deps "$RUNNER_TEMP"/invariants-wheels/*.whl
          cd "$RUNNER_TEMP"
          "$installed_python" -I -B "$GITHUB_WORKSPACE/scripts/verify_installed.py" --mode wheel --source-root "$GITHUB_WORKSPACE"
          "$installed_python" -m pip install --no-deps -e "$GITHUB_WORKSPACE"
          "$installed_python" -I -B "$GITHUB_WORKSPACE/scripts/verify_installed.py" --mode editable --source-root "$GITHUB_WORKSPACE"
