[build-system]
requires = [
    "setuptools==82.0.1; python_version < '3.10'",
    "setuptools==84.0.0; python_version >= '3.10'",
]
build-backend = "setuptools.build_meta"

[project]
name = "szl-invariants"
version = "0.1.0"
description = "Eight falsifiable receipt/ledger invariants. Software kernel, not a trained model."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
crypto = ["cryptography>=46,<50"]
dev = ["tomli==2.4.1; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-invariants"
Source = "https://github.com/szl-holdings/szl-invariants"
Issues = "https://github.com/szl-holdings/szl-invariants/issues"
Changelog = "https://github.com/szl-holdings/szl-invariants/releases"

[tool.setuptools]
packages = ["szl_invariants"]
package-dir = {"" = "torch-ext"}
include-package-data = false

[tool.setuptools.package-data]
szl_invariants = ["metadata.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.szl.release]
import_names = ["szl_invariants"] # wheel top-level import names; the release gate fails if the built wheel differs
