[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-invariants"
version = "0.1.0"
description = "Eight falsifiable receipt/ledger invariants. Software kernel, not a trained model."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"

[project.optional-dependencies]
crypto = ["cryptography>=46,<50"]

[tool.setuptools]
packages = ["szl_invariants"]
package-dir = {"" = "torch-ext"}
include-package-data = false

[tool.setuptools.package-data]
szl_invariants = ["metadata.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
